name: Fix envelope wax monogram

on:
  push:
    paths:
      - "scripts/fix-envelope-monogram.py"

permissions:
  contents: write

jobs:
  fix-monogram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --quiet pillow opencv-python-headless numpy

      - name: Generate seal verification preview
        run: WEDDING_PREVIEW_ONLY=1 python scripts/fix-envelope-monogram.py

      - name: Commit verification preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/envelope-monogram-preview.b64
          if git diff --cached --quiet; then
            echo "No preview change detected."
            exit 0
          fi
          git commit -m "Add wax monogram verification preview"
          git push origin HEAD:main
